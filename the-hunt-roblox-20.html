<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The Hunt: Roblox 20 — play the best games from every era of Roblox.">
    <meta name="robots" content="noindex, follow">
    <title>The Hunt: Roblox 20</title>

    <link rel="stylesheet" href="archive-halloween/assets/d706fa7361f26569ce9481ec468f9f0da29aa7a0623e0da9d19a772490192ed1-FoundationCss.css">
    <link rel="stylesheet" href="archive-halloween/assets/cbc004c933c81fb07d6c57dd882001686ae4f26f1f13134ea1b138d7866af876-ReactStyleGuide.css">
    <link rel="stylesheet" href="archive-halloween/assets/7f4f10003b8708331d7c8f20bf584a6478db0a83a986877b6c8d079f74be0a42-StyleGuide.css">
    <link rel="stylesheet" href="archive-halloween/assets/835ad8483ecae12366bf4b80701ee78af7c5b58cdb95a529e061851cf7bc1c7f-Builder.css">
    <link rel="stylesheet" href="archive-halloween/assets/523c59064ab61f06e8d52365e916d731063e2a67981bcf994376f68214f5f8e4-Thumbnails.css">
    <link rel="stylesheet" href="archive-halloween/assets/7d808932809aa55941fddb3492faf069861083ff61167a883d8a835518c8000f-Navigation.css">
    <link rel="stylesheet" href="archive-halloween/assets/d9618808344e48ea410ac2fa550fbb606e5397c39a0f6d381f9051bfbf43a783-Footer.css">
    <link rel="stylesheet" href="archive-halloween/assets/2b1755bad0b1fecc7cc797f785464a52f1c43220811d2765c6f343710ec9aa8a-SduiLandingPage.css">

    <style>
        @font-face {
            font-family: "Builder Sans Local";
            src: url("archive-halloween/assets/3e19a797e2ce0522.woff2") format("woff2");
            font-style: normal;
            font-weight: 100 900;
        }

        html, body { margin: 0; min-height: 100%; }
        body {
            background: #121215;
            color: #f7f7f8;
            font-family: "Builder Sans Local", "Builder Sans", Arial, sans-serif;
        }
        a { color: inherit; }
        #content { min-height: calc(100vh - 56px); }
        #sdui-landing-page-main-content > div { min-height: 100vh; }
        .archive-spotlight-placeholder,
        .archive-tile-placeholder {
            align-items: center;
            background:
                linear-gradient(135deg, rgba(255,255,255,.06) 25%, transparent 25%) 0 0 / 24px 24px,
                linear-gradient(315deg, rgba(255,255,255,.06) 25%, transparent 25%) 0 0 / 24px 24px,
                #272930;
            color: #bcbec8;
            display: flex;
            font-size: 12px;
            font-weight: 700;
            justify-content: center;
            letter-spacing: .08em;
            text-align: center;
            text-transform: uppercase;
        }
        .archive-spotlight-placeholder {
            aspect-ratio: 3 / 1;
            height: 100%;
            min-width: 100%;
        }
        .archive-tile-placeholder {
            aspect-ratio: 1.77778 / 1;
            border-radius: 8px;
            width: 100%;
        }
        .archive-tile-thumbnail {
            display: block;
            height: 100%;
            object-fit: cover;
            width: 100%;
        }
        .archive-source-note {
            border-top: 1px solid rgba(255,255,255,.12);
            color: #bcbec8;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 12px;
            padding-top: 16px;
        }
        .archive-source-note a { color: #70a0ff; }
        .archive-error {
            border: 1px solid #e75750;
            color: #f7cdcb;
            padding: 16px;
        }
        @media (max-width: 500px) {
            .archive-spotlight-placeholder { min-height: 320px; }
        }
    </style>
</head>
<body id="rbx-body" dir="ltr" class="rbx-body dark-theme forced-theme age-roblox-theme builder-font classic-theme">
    <div id="header" class="navbar-fixed-top rbx-header" role="navigation" aria-label="Roblox navigation">
        <div class="container-fluid">
            <div class="rbx-navbar-header">
                <div class="navbar-header">
                    <a id="nav-logo-link" class="navbar-brand" href="index.html" aria-label="Roblox home">
                        <span class="icon-logo"></span><span class="icon-logo-r"></span>
                    </a>
                </div>
            </div>
            <ul class="nav rbx-navbar hidden-xs hidden-sm col-md-5 col-lg-4">
                <li><a class="font-header-2 nav-menu-title text-header" href="https://www.roblox.com/charts">Charts</a></li>
                <li><a class="font-header-2 nav-menu-title text-header" href="https://www.roblox.com/catalog?Landing=true">Marketplace</a></li>
                <li><a class="font-header-2 nav-menu-title text-header" href="https://create.roblox.com/">Create</a></li>
                <li style="order: -1"><a class="font-header-2 nav-menu-title text-header" href="index.html">Home</a></li>
            </ul>
            <div id="right-navigation-header">
                <div class="navbar-left navbar-search col-xs-5 col-sm-6 col-md-2 col-lg-3 shown" role="search">
                    <div class="input-group">
                        <form action="#" onsubmit="return false;">
                            <div class="form-has-feedback">
                                <input id="navbar-search-input" type="search" class="form-control input-field new-input-field" placeholder="Search" maxlength="120" autocomplete="off">
                            </div>
                        </form>
                        <div class="input-group-btn"><button class="input-addon-btn" type="button" aria-label="Search"><span class="icon-common-search-sm"></span></button></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <main id="content" class="content">
        <div id="sdui-landing-page-web-app">
            <div id="sdui-landing-page-main-content"></div>
        </div>
    </main>

    <script>
        const mount = document.querySelector("#sdui-landing-page-main-content");

        function escapeHtml(value) {
            return String(value).replace(/[&<>'"]/g, (character) => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
            }[character]));
        }

        function safeRichText(value) {
            const parsed = new DOMParser().parseFromString(String(value || ""), "text/html");
            parsed.querySelectorAll("script, iframe, object, embed, style, form").forEach((element) => element.remove());
            parsed.querySelectorAll("*").forEach((element) => {
                [...element.attributes].forEach((attribute) => {
                    if (attribute.name.toLowerCase().startsWith("on")) element.removeAttribute(attribute.name);
                });
            });
            return parsed.body.innerHTML;
        }

        function gameUrl(data, game) {
            const universe = data.hydrationData && data.hydrationData.universe && data.hydrationData.universe[game.universeId];
            return universe && universe.canonicalUrlPath
                ? `https://www.roblox.com${universe.canonicalUrlPath}`
                : `https://www.roblox.com/games/${encodeURIComponent(game.universeId)}`;
        }

        function renderHeader(header) {
            const attribution = header.foregroundHeaderEntry.attributionRow;
            return `
                <div>
                    <div class="relative flex justify-center items-start">
                        <div data-testid="sdui-page-header-background" class="relative width-full" style="max-width: 1368px;">
                            <div data-testid="sdui-image" style="width: 100%; height: 440px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; flex-direction: column;">
                                <div data-testid="sdui-image-container" style="aspect-ratio: 3 / 1; min-width: 100%; flex: 1 1 0%;">
                                    <div class="archive-spotlight-placeholder" role="img" aria-label="Archived Spotlight image unavailable">Archived Spotlight image unavailable</div>
                                </div>
                            </div>
                            <div aria-hidden="true" data-testid="gradient-overlay" style="position: absolute; bottom: 0; left: 0; width: 100%; height: 50%; background: linear-gradient(0deg, var(--color-surface-0), 50%, color-mix(in srgb, var(--color-surface-300) 0%, transparent));"></div>
                        </div>
                        <div data-testid="sdui-page-header-foreground" class="absolute bottom-[0] left-[0] width-full flex justify-center" style="padding-bottom: 24px; padding-left: 48px; padding-right: 48px;">
                            <div data-testid="sdui-page-header-foreground-content" class="width-full" style="max-width: 850px;">
                                <div class="flex relative flex-row items-center width-full gap-x-small">
                                    <div class="flex flex-col items-start max-width-full min-width-none" data-testid="attribution-text-content-container" style="row-gap: 8px;">
                                        <h1 class="clip text-display-small text-truncate-end padding-none" style="overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: pre-line;">${escapeHtml(attribution.title)}</h1>
                                        <h2 class="text-body-medium clip text-truncate-end padding-none" style="overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: pre-line;">${escapeHtml(attribution.subtitle)}</h2>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        function renderCarousel(data, carousel) {
            const cards = carousel.universeItems.map((game) => `
                <div id="collection-carousel-item" class="css-1c2ze5h-carouselItem">
                    <a href="${gameUrl(data, game)}" target="_blank" rel="noreferrer" class="gap-small sdui-game-tile-wrapper" aria-label="${escapeHtml(game.title)}" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; width: 100%; height: 100%;">
                        <div data-testid="sdui-tile-image-container" class="sdui-tile-image-container radius-medium" style="position: relative; width: 100%; aspect-ratio: 1.77778 / 1; overflow: hidden;">
                            <img class="archive-tile-thumbnail" data-thumbnail="${escapeHtml(game.universeId)}" src="archive-halloween/assets/thumbnails/${encodeURIComponent(game.universeId)}.png" alt="" loading="lazy">
                            <div class="archive-tile-placeholder" role="img" aria-label="Archived image unavailable" hidden>Image unavailable</div>
                        </div>
                        <div style="display: flex; flex-direction: row; gap: 4px; width: 100%;">
                            <div style="flex-grow: 1; min-width: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: center;">
                                <h5 data-sdui-text="true" class="m-0 p-0 text-title-medium content-emphasis" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; overflow-wrap: break-word; padding: 0;">${escapeHtml(game.title)}</h5>
                                <div class="flex flex-row items-center w-full border-0 bg-transparent p-0 m-0 whitespace-nowrap overflow-hidden gap-xsmall" aria-label="${escapeHtml(game.subtitle || "Archived experience")}">
                                    <p data-sdui-text="true" class="h-full w-full truncate text-body-medium content-default" style="padding: 0;">${escapeHtml(game.subtitle || "Archived experience")}</p>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>`).join("");

            return `
                <div>
                    <div class="css-koapdt-collectionCarouselContainer">
                        <div data-testid="section-header" class="relative flex w-full items-center justify-between">
                            <div data-testid="section-header-title-subtitle-container" class="min-w-0 flex-1 w-full">
                                <div class="flex min-w-0 flex-1 w-full flex-col items-start gap-xxsmall">
                                    <div data-testid="text-icon-row" class="inline-flex w-full items-center border-0 bg-transparent p-0 m-0" aria-label="${escapeHtml(carousel.title)}">
                                        <h3 data-sdui-text="true" data-testid="text-icon-row-text" class="min-w-0 flex-shrink truncate text-heading-small content-emphasis" style="padding: 0;">${escapeHtml(carousel.title)}</h3>
                                    </div>
                                    <div data-testid="text-icon-row" class="inline-flex w-full items-center border-0 bg-transparent p-0 m-0" aria-label="${escapeHtml(carousel.subtitle)}">
                                        <h4 data-sdui-text="true" data-testid="text-icon-row-text" class="min-w-0 flex-shrink truncate text-body-medium content-default" style="padding: 0;">${escapeHtml(carousel.subtitle)}</h4>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="css-1q720wr-carouselContainer">
                            <div class="css-1i465w8-carousel">
                                ${cards}
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        fetch("spotlight.json")
            .then((response) => {
                if (!response.ok) throw new Error(`spotlight.json returned ${response.status}`);
                return response.json();
            })
            .then((data) => {
                const header = data.pageEntries[0].inputData.pageHeader;
                const feed = data.pageEntries[1].inputData.verticalFeed;
                const entries = feed.entryOrder.map((key) => feed.entryMap[key]);
                const textEntry = entries.find((entry) => entry.robloxComponent === "SpotlightText");
                const carousels = entries
                    .filter((entry) => entry.robloxComponent === "SpotlightCollectionCarousel")
                    .map((entry) => entry.inputData.experienceCarousel);
                const experienceCount = carousels.reduce((total, carousel) => total + carousel.universeItems.length, 0);

                mount.innerHTML = `
                    <div style="display: flex; flex-direction: column; min-height: 100vh; gap: 24px;">
                        ${renderHeader(header)}
                        <div>
                            <div class="flex justify-center" style="padding-left: 48px; padding-right: 48px;">
                                <div class="flex flex-col width-full" style="gap: 36px; max-width: 850px;">
                                    <p data-testid="sdui-text" class="text-truncate-end text-body-medium content-default" style="overflow-wrap: break-word; white-space: pre-line; transform-origin: 0 0;">${safeRichText(textEntry.inputData.text.text)}</p>
                                    ${carousels.map((carousel) => renderCarousel(data, carousel)).join("")}
                                    <div class="archive-source-note">Archived layout based on the Roblox Spotlight page. Content loaded from <a href="spotlight.json">spotlight.json</a> — ${carousels.length} eras, ${experienceCount} experiences.</div>
                                </div>
                            </div>
                        </div>
                    </div>`;
                mount.querySelectorAll("[data-thumbnail]").forEach((image) => {
                    image.addEventListener("error", () => {
                        image.hidden = true;
                        image.nextElementSibling.hidden = false;
                    });
                });
            })
            .catch((error) => {
                mount.innerHTML = `<div class="flex justify-center" style="padding: 48px;"><div class="archive-error">The Hunt archive could not load its local JSON data.</div></div>`;
                console.error(error);
            });
    </script>
</body>
</html>
